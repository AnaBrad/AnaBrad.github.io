<title>Pagina nu a fost găsită — Ana-Maria Brad</title>
<script>
// Sectiunile in engleza au fost eliminate (site RO-only). Orice link vechi /en/
// duce la echivalentul romanesc, ca sa nu ajungi intr-un capat mort.
(function () {
  var p = location.pathname;
  var to = null;
  if (p.indexOf("/instrumente-coaching/en/") === 0) to = "/instrumente-coaching/";
  else if (p.indexOf("/blog/en/") === 0) to = "/blog/";
  else if (p.indexOf("/en/") === 0) to = "/";
  if (to) location.replace(to);
})();
</script>
