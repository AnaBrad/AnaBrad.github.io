<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
.lbars { display:flex; align-items:flex-end; gap:12px; height:320px; }
.lbar { width:56px; border-radius:14px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:26px; }
.lbar span { font-family:'Fraunces',serif; font-weight:400; font-size:34px; color:#faf5ea; }
</style>
</head>
<body>
<div class="frame">
  <div class="left">
    <div class="top-block">
      <div class="eyebrow">Ana-Maria Brad · A coaching tool</div>
      <div class="title">OSKAR<span class="ital">Model</span></div>
      <div class="subtitle">From solutions to concrete steps, for teams.</div>
    </div>
    <div class="footer"><span class="dom">anamariabrad.ro</span><span class="muted"> · coaching tools</span></div>
  </div>
  <div class="right">
    <div class="card">
      <div class="lbars">
        <div class="lbar" style="height:150px;background:#b6cab2;"><span>O</span></div>
        <div class="lbar" style="height:190px;background:#9bb798;"><span>S</span></div>
        <div class="lbar" style="height:230px;background:#82a37f;"><span>K</span></div>
        <div class="lbar" style="height:270px;background:#6e9070;"><span>A</span></div>
        <div class="lbar" style="height:310px;background:#5d8560;"><span>R</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
